name: Live Wix vs new site
# Read-only check of the live Wix site from the CI runner (the cloud team cannot reach it):
# 1) every URL in the live sitemap must exist in the new build (page or redirect) — no broken
#    links on the DNS day; 2) side-by-side screenshots (Wix left, new right) on phone + desktop
#    for the owner's quality bar. Results go to the job summary and to a NEW branch
#    review/compare-<run id> (screenshots only, never merged). Nothing is pushed to main.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/live-vs-new.yml"
      - "tools/live_urls.py"
      - "tools/compare_shots.mjs"
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown==3.7
      - run: python3 build.py
      - name: Live sitemap vs new build
        run: |
          python3 tools/live_urls.py --write tests/wix-live-urls.json | tee -a "$GITHUB_STEP_SUMMARY"
          mkdir -p review/compare && cp tests/wix-live-urls.json review/compare/
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Side-by-side screenshots
        run: |
          node tools/compare_shots.mjs review/compare
          cat review/compare/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Push screenshots to a review branch
        run: |
          git config user.name "We International"
          git config user.email "info@weintervisa.com"
          b="review/compare-${{ github.run_id }}"
          git checkout --orphan "$b"
          git rm -rfq --cached .
          git add review/compare
          git commit -qm "Wix vs new site: side-by-side screenshots and live URL list (run ${{ github.run_id }})"
          git push origin "$b"
          echo "branch: $b" >> "$GITHUB_STEP_SUMMARY"
