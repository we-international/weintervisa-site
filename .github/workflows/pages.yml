name: Build and deploy (GitHub Pages)
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 */6 * * *"   # pick up migration agents staff listed in GetWec (every 6 hours)
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown==3.7
      # Registered migration agents that staff checked and pressed "show on website" in GetWec.
      # Public fields only; if GetWec does not answer, the committed snapshot is kept.
      - name: Fetch listed migration agents from GetWec
        if: github.ref == 'refs/heads/main'
        run: |
          ep=$(python3 -c "import json;print(json.load(open('config.json'))['getwec_endpoint'])")
          if curl -fsS --max-time 20 "$ep?action=migration_partners" -o /tmp/mp.json && \
             python3 -c "import json;d=json.load(open('/tmp/mp.json'));assert isinstance(d['partners'],list)"; then
            python3 -c "import json;d=json.load(open('/tmp/mp.json'));json.dump({'partners':d['partners'],'_note':'Written by CI from GetWec (listed agents only). Do not edit by hand.'},open('content/migration-partners.json','w'),indent=1)"
            echo "listed agents: $(python3 -c "import json;print(len(json.load(open('content/migration-partners.json'))['partners']))")"
          else
            echo "::warning::GetWec list not available; keeping the committed snapshot"
          fi
      - run: python3 tests/test_site.py
      # Go-live dry run: the exact build www.weintervisa.com will serve after the DNS switch.
      - run: python3 tests/test_production.py
      # One switch for the DNS day (docs/go-live.md): config.json "live": true → production
      # build (indexable, canonical www.weintervisa.com, CNAME) at the root of the custom domain.
      # While "live" is false the preview host is a project page under /weintervisa-site/,
      # so the upload is rebuilt with that base path (tests above run on the plain build).
      - name: Build for upload (preview or live)
        if: github.ref == 'refs/heads/main'
        run: |
          if python3 -c "import json,sys;sys.exit(0 if json.load(open('config.json')).get('live') is True else 1)"; then
            python3 build.py --production
          else
            SITE_BASE=/weintervisa-site python3 build.py
          fi
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
